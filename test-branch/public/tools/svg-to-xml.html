<body class="tool" data-page="tool" data-tool="svg">
<main class="tool-main">
  <a class="back" href="/#work">&larr; All tools</a>
  <h1 class="ttl">SVG to XML</h1>
  <p class="lead">Paths, shapes, gradients and strokes become native Alight Motion shapes. Runs on your device.</p>
  <details>
      <summary>Canvas settings</summary>
      <div class="grid">
        <label>Width<input id="cw" type="number" value="1080"></label>
        <label>Height<input id="ch" type="number" value="1080"></label>
        <label>FPS<input id="cf" type="number" value="30"></label>
        <label>Length (ms)<input id="cd" type="number" value="2000"></label>
        <label>Background<input id="cb" type="color" value="#ffffff"></label>
      </div>
    </details>
  <section class="panel" id="svg">
      <label class="drop"><input id="vfile" type="file" accept=".svg,image/svg+xml,text/xml"><b>Choose an SVG file</b><span id="vname">Tap here or drop a file</span></label>
      <label>or paste SVG code<textarea id="vin" placeholder="<svg ...>"></textarea></label>
      <div class="row"><button class="btn" id="vgo">Convert to Alight Motion XML</button></div>
      <p class="msg" id="vmsg"></p>
      <textarea id="vout" readonly aria-label="Converted XML"></textarea>
      <div class="row"><button class="btn alt" data-copy="vout">Copy</button><button class="btn alt" data-dl="vout">Download .xml</button></div>
    </section>
  <nav class="others" aria-label="Other tools"><span>More tools</span><a href="/tools/image-to-xml.html">Image to XML</a><a href="/tools/star-maker.html">Star maker</a><a href="/tools/preset-finder.html">Preset Finder</a><a href="/tools/color-converter.html">Color converter</a><a href="/tools/xml-checker.html">XML checker</a></nav>
