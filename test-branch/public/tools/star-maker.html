<title>Star maker | Shin's Archive</title>
<meta name="description" content="Native star shapes and star grids.">
<meta property="og:title" content="Star maker | Shin's Archive"><meta property="og:description" content="Native star shapes and star grids."><meta property="og:type" content="website">

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<body class="tool" data-page="tool" data-tool="star">
<main class="tool-main">
  <a class="back" href="/#work">&larr; All tools</a>
  <h1 class="ttl">Star maker</h1>
  <p class="lead">Native star shapes and star grids.</p>
  <details>
      <summary>Canvas settings</summary>
      <div class="grid">
        <label>Width<input id="cw" type="number" value="1080"></label>
        <label>Height<input id="ch" type="number" value="1080"></label>
        <label>FPS<input id="cf" type="number" value="30"></label>
        <label>Length (ms)<input id="cd" type="number" value="2000"></label>
        <label>Background<input id="cb" type="color" value="#ffffff"></label>
      </div>
    </details>
  <section class="panel" id="star">
      <div class="grid">
        <label>Points<input id="sp" type="number" value="5" min="3"></label>
        <label>Outer radius<input id="so" type="number" value="100"></label>
        <label>Inner radius<input id="si" type="number" value="50"></label>
        <label>Rotation<input id="sa" type="number" value="0"></label>
        <label>Stroke size<input id="ss" type="number" value="1.5" step="0.5"></label>
        <label>Copies<input id="sn" type="number" value="1" min="1" max="200"></label>
        <label>Gap<input id="sg" type="number" value="40"></label>
        <label>Fill<input id="sc" type="color" value="#ea8f3b"></label>
        <label>Opacity %<input id="sop" type="number" value="100" min="0" max="100"></label>
      </div>
      <div class="row"><button class="btn" id="sgo">Generate XML</button></div>
      <textarea id="sout" readonly aria-label="Star XML output"></textarea>
      <div class="row"><button class="btn alt" data-copy="sout">Copy</button><button class="btn alt" data-dl="sout">Download .xml</button></div>
    </section>
  <nav class="others" aria-label="Other tools"><span>More tools</span><a href="/tools/svg-to-xml.html">SVG to XML</a><a href="/tools/image-to-xml.html">Image to XML</a><a href="/tools/preset-finder.html">Preset Finder</a><a href="/tools/color-converter.html">Color converter</a><a href="/tools/xml-checker.html">XML checker</a></nav>
</main>
<script src="/js/common.js"></script>
<script src="/js/tools/star.js"></script>
<script src="/js/site.js"></script>
<script src="/js/fx.js"></script>
</body>
</html>
